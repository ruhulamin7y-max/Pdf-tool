<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Contrast Chalkboard Studio</title>
    
    <!-- Handwriting & High Contrast Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    
    <!-- Export Engines -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

    <style>
        :root {
            --board-bg: #0a1f14; /* Deep Physiological Green */
            --wood-frame: #2d1b10;
            --chalk-white: #ffffff;
            --chalk-yellow: #ffee58;
            --chalk-mint: #69f0ae;
            --chalk-blue: #b3e5fc;
        }

        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: 'Montserrat', sans-serif;
            margin: 0; padding: 20px;
        }

        /* UI Styling */
        .container { max-width: 900px; margin: 0 auto; }
        .input-area {
            background: #161b22; padding: 20px;
            border-radius: 12px; border: 1px solid #30363d;
            margin-bottom: 30px;
        }
        textarea {
            width: 100%; height: 120px; background: #010409;
            color: var(--chalk-mint); border: 1px solid #30363d;
            border-radius: 8px; padding: 15px; font-family: monospace;
        }
        .btn-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn {
            flex: 1; padding: 15px; border-radius: 8px; border: none;
            cursor: pointer; font-weight: 900; text-transform: uppercase; font-size: 13px;
        }
        .btn-preview { background: #238636; color: white; }
        .btn-pdf { background: #30363d; color: white; border: 1px solid #8b949e; }
        .btn-ppt { background: #d1242f; color: white; }

        /* REALISTIC CHALKBOARD DESIGN */
        .slide-container {
            width: 100%; aspect-ratio: 16/9;
            background: var(--board-bg);
            border: 15px solid var(--wood-frame);
            border-radius: 4px;
            position: relative;
            margin-bottom: 50px;
            display: flex; flex-direction: column; justify-content: center;
            padding: 5% 7%; box-sizing: border-box;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        /* Realistic Chalk Dust & Texture Noise */
        .slide-container::before {
            content: ""; position: absolute; inset: 0;
            background-image: url('https://www.transparenttextures.com/patterns/black-board.png');
            opacity: 0.3; pointer-events: none;
        }
        .slide-container::after {
            content: ""; position: absolute; inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Slide Text Styling */
        .q-text {
            font-family: 'Gochi Hand', cursive;
            font-size: 44px; color: var(--chalk-white);
            line-height: 1.2; margin-bottom: 35px; z-index: 5;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; z-index: 5; }
        .opt-item {
            font-family: 'Gochi Hand', cursive; font-size: 34px;
            color: var(--chalk-yellow); padding: 5px;
        }
        .opt-item span { font-family: 'Montserrat'; font-weight: 900; margin-right: 15px; }

        /* Answer Reveal Slide */
        .ans-layout { text-align: center; z-index: 5; width: 100%; }
        .ans-big-letter {
            font-size: 150px; font-weight: 900; color: var(--chalk-mint);
            margin: 0; text-shadow: 0 0 30px rgba(105,240,174,0.5);
        }
        .ans-big-text { font-family: 'Gochi Hand'; font-size: 45px; color: white; margin-bottom: 25px; }
        .exp-box { font-family: 'Gochi Hand'; font-size: 28px; color: var(--chalk-blue); max-width: 90%; margin: 0 auto; line-height: 1.3; }

        #status { text-align: center; color: var(--chalk-mint); margin-bottom: 15px; font-weight: 900; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align:center; margin-bottom:20px;">
        <h2 style="font-family:'Gochi Hand'; font-size:40px; color:var(--chalk-yellow);">🖊️ Classroom MCQ Studio</h2>
    </div>

    <div class="input-area">
        <textarea id="mcqInput" placeholder="Paste data here: Question | A | B | C | D | Correct Index (1-4) | Explanation"></textarea>
        <div class="btn-row">
            <button class="btn btn-preview" onclick="renderPreview()">👁️ Preview Set</button>
            <button class="btn btn-pdf" onclick="exportPDF()">📄 Download HD PDF</button>
            <button class="btn btn-ppt" onclick="exportPPT()">📊 Download HD PPT</button>
        </div>
        <div id="status"></div>
    </div>

    <div id="preview-area">
        <!-- Slides will generate here -->
    </div>
</div>

<script>
    let mcqData = [];
    const LBL = ["A", "B", "C", "D"];

    function parseInput() {
        const text = document.getElementById('mcqInput').value.trim();
        const lines = text.split('\n');
        const data = [];
        lines.forEach(line => {
            if(!line.includes('|')) return;
            const c = line.split('|').map(s => s.trim());
            if(c.length < 6 || c[0].toLowerCase().includes('question')) return;
            data.push({ q: c[0], opts: [c[1], c[2], c[3], c[4]], ans: parseInt(c[5]) - 1, exp: c[6] || "" });
        });
        return data;
    }

    function renderPreview() {
        mcqData = parseInput();
        const area = document.getElementById('preview-area');
        area.innerHTML = '';
        
        mcqData.forEach((m, i) => {
            area.innerHTML += `
                <div style="text-align:center; color:#8b949e; margin-bottom:10px;">QUESTION ${i+1}</div>
                <!-- SLIDE 1: QUESTION -->
                <div class="slide-container" id="slide-q-${i}">
                    <div class="q-text">Q.${i+1} ${m.q}</div>
                    <div class="options-grid">
                        ${m.opts.map((o, oi) => `<div class="opt-item"><span>${LBL[oi]}</span> ${o}</div>`).join('')}
                    </div>
                </div>
                <!-- SLIDE 2: ANSWER -->
                <div class="slide-container" id="slide-a-${i}">
                    <div class="ans-layout">
                        <div style="font-size:22px; color:var(--chalk-yellow); letter-spacing:3px;">CORRECT ANSWER</div>
                        <div class="ans-big-letter">${LBL[m.ans]}</div>
                        <div class="ans-big-text">${m.opts[m.ans]}</div>
                        <div class="exp-box">Explanation: ${m.exp}</div>
                    </div>
                </div>
            `;
        });
        document.getElementById('status').innerText = `✅ Prepared ${mcqData.length} Question Sets.`;
    }

    async function exportPDF() {
        renderPreview();
        if(!mcqData.length) return;
        document.getElementById('status').innerText = "⏳ Capturing High-Contrast Slides...";
        
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('l', 'mm', [297, 167]);
        const slides = document.querySelectorAll('.slide-container');

        for(let i=0; i < slides.length; i++) {
            const canvas = await html2canvas(slides[i], { scale: 2 });
            const imgData = canvas.toDataURL('image/png');
            if(i > 0) pdf.addPage([297, 167], 'l');
            pdf.addImage(imgData, 'PNG', 0, 0, 297, 167);
        }
        pdf.save("Chalkboard_Slides.pdf");
        document.getElementById('status').innerText = "✅ PDF Downloaded!";
    }

    function exportPPT() {
        mcqData = parseInput();
        if(!mcqData.length) return;
        let pres = new PptxGenJS();
        pres.layout = 'LAYOUT_WIDE';

        mcqData.forEach((m, i) => {
            // Slide 1: Question
            let s1 = pres.addSlide();
            s1.background = { color: '0a1f14' };
            s1.addText(`Q.${i+1} ${m.q}`, { x:0.5, y:1.2, w:12, color:'FFFFFF', fontSize:38, fontFace:'Comic Sans MS', bold:true, align:'center' });
            s1.addText(`A. ${m.opts[0]}`, { x:1, y:4.2, w:5.5, color:'ffee58', fontSize:30, fontFace:'Comic Sans MS' });
            s1.addText(`B. ${m.opts[1]}`, { x:7, y:4.2, w:5.5, color:'ffee58', fontSize:30, fontFace:'Comic Sans MS' });
            s1.addText(`C. ${m.opts[2]}`, { x:1, y:5.8, w:5.5, color:'ffee58', fontSize:30, fontFace:'Comic Sans MS' });
            s1.addText(`D. ${m.opts[3]}`, { x:7, y:5.8, w:5.5, color:'ffee58', fontSize:30, fontFace:'Comic Sans MS' });

            // Slide 2: Answer
            let s2 = pres.addSlide();
            s2.background = { color: '06140d' };
            s2.addText(LBL[m.ans], { x:0, y:1.5, w:13.3, color:'69f0ae', fontSize:140, align:'center', bold:true, fontFace:'Arial Black' });
            s2.addText(m.opts[m.ans], { x:0, y:4.2, w:13.3, color:'FFFFFF', fontSize:48, align:'center', fontFace:'Comic Sans MS' });
            s2.addText(m.exp, { x:1, y:5.8, w:11.3, color:'b3e5fc', fontSize:26, align:'center', italic:true, fontFace:'Comic Sans MS' });
        });
        pres.writeFile({ fileName: 'Chalkboard_MCQ_Set.pptx' });
    }
</script>

</body>
</html>
